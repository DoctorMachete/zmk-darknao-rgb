description: |
  Sharp two-color blink of one LED (by strip position), on either half. This is a
  preset behavior: each named instance carries its own two colors and blink
  frequency, and is invoked with a single parameter (the global strip position).
  The LED hard-alternates color1 and color2 (color2 may be black for an off
  half-cycle) as a square wave. Stop a blink with the fixed &pixlblink_off
  behavior. Frequency encoding: freq_hz = frequency / 10 (so 5 = 0.5 Hz, 10 = 1 Hz).

compatible: "zmk,behavior-pixlblink"

include: one_param.yaml

properties:
  color1:
    type: int
    required: false
    default: 0xFFFFFF
    description: First (ON half-cycle) color, packed 0xRRGGBB.
  color2:
    type: int
    required: false
    default: 0x000000
    description: Second (OFF half-cycle) color, packed 0xRRGGBB. Black by default.
  frequency:
    type: int
    required: false
    default: 5
    description: Blink frequency code; freq_hz = frequency / 10 (5 = 0.5 Hz).
  blink-count:
    type: int
    required: false
    default: 0
    description: |
      Blink this many times, then stop by itself (1..255). A counted blink is timed from
      the moment it starts, so it always opens on color1; it shows color2 between blinks
      and ends after its last color1 half (2 * blink-count - 1 half-periods), revealing
      whatever is beneath, as &pixlblink_off would. 0 (the default) blinks until
      &pixlblink_off. Fork patch, see PATCH_PIXLBLINK.md.
