description: Toggle Layer

compatible: "zmk,behavior-toggle-layer"

include: one_param.yaml

properties:
  toggle-mode:
    type: string
    required: false
    default: "flip"
    enum:
      - "on"
      - "off"
      - "flip"
  locking:
    type: boolean
    description: |
      Fork, ported from upstream ZMK main (PATCH_LAYER_LOCKING.md). A layer turned on by a
      locking behavior is locked: behaviors without `locking` (stock &mo, &sl, conditional
      layers, modules) can't turn it off. A locking deactivation turns it off and unlocks it.
